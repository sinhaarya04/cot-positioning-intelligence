[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cot-positioning-intelligence"
version = "0.2.0"
description = "Auditable CFTC positioning research and descriptive forward-return analysis"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "requests>=2.32,<3",
  "yfinance>=0.2.54,<2",
  "streamlit>=1.42,<2",
  "plotly>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
llm = ["torch>=2.5,<3", "transformers>=4.46,<6", "accelerate>=1,<2"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
